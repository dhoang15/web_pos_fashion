<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Admin - Giao diện HTML tĩnh</title>
    <!-- Tích hợp Bootstrap 5 qua mạng để tự động làm đẹp giao diện -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>

<div class="container-fluid px-4 w-75 mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-white pt-3">
            <h4 class="mb-0">Add Admin 
                <a href="#" class="btn btn-primary float-end">Back</a>
            </h4>
        </div>
        <div class="card-body">
            <!-- Form HTML -->
            <form>
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Name *</label>
                        <input type="text" name="name" required class="form-control" placeholder="Nhập tên..." />
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" required class="form-control" placeholder="Nhập email..." />
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Password *</label>
                        <input type="password" name="password" required class="form-control" />
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number *</label>
                        <input type="text" name="phone" required class="form-control" placeholder="Nhập SĐT..." />
                    </div>
                    
                    <div class="col-md-3 mb-3 text-start">
                        <label class="form-label">Is Ban</label><br/>
                        <input type="checkbox" name="is_ban" style="width:25px;height:25px; cursor: pointer;" />
                    </div>
                    
                    <div class="col-md-12 mb-3 text-end">
                        <button type="button" class="btn btn-primary px-4" onclick="alert('Đây là giao diện HTML tĩnh. Bạn cần PHP và Database để thực sự lưu dữ liệu nhé!')">Save</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
