<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f9fa">
    <title>Danh mục | B'TRIPLE POS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/custom.css">
    <link rel="stylesheet" href="../../assets/css/management.css">
    <link rel="stylesheet" href="../../pages/categories/categories.css">
</head>
<body class="app-shell management-page categories-page" data-app-root="../.." data-page="categories" data-title="Danh mục">
    <div id="header-container"></div>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="app-main flex-grow-1">
            <section class="page-heading d-flex flex-wrap align-items-end justify-content-between gap-3">
                <div>
                    <span class="management-eyebrow">CATEGORY CONTROL</span>
                    <h1>Danh mục sản phẩm</h1>
                    <p>Tạo và quản lý nhóm sản phẩm trong cửa hàng.</p>
                </div>
            </section>

            <section class="surface-card management-panel category-editor-panel p-3 p-lg-4 mb-4" id="category-editor" data-admin-only>
                <div class="category-panel-heading">
                    <div><span class="management-eyebrow">CATEGORY DETAILS</span><h2 class="h5 fw-bold mb-0" id="category-form-title">Thêm danh mục</h2></div>
                    <span class="category-form-icon"><i class="bi bi-bookmark-plus" aria-hidden="true"></i></span>
                </div>
                <form id="category-form" class="row g-3 align-items-end">
                    <input type="hidden" name="id">
                    <div class="col-12 col-lg-4">
                        <label class="form-label fw-semibold" for="category-name">Tên danh mục</label>
                        <input class="form-control" id="category-name" name="name" maxlength="100" placeholder="Ví dụ: Áo sơ mi" required>
                    </div>
                    <div class="col-12 col-lg-6">
                        <label class="form-label fw-semibold" for="category-description">Mô tả</label>
                        <input class="form-control" id="category-description" name="description" maxlength="500" placeholder="Mô tả ngắn về nhóm sản phẩm">
                    </div>
                    <div class="col-7 col-lg-1 d-grid">
                        <button class="btn btn-management-primary" id="save-category" type="submit">Thêm</button>
                    </div>
                    <div class="col-5 col-lg-1 d-grid">
                        <button class="btn btn-outline-secondary" id="cancel-category-edit" type="button" hidden>Hủy sửa</button>
                    </div>
                </form>
                <p id="categories-status" class="status-message small mt-3 mb-0" aria-live="polite">Đang tải danh mục...</p>
            </section>

            <section class="surface-card management-panel category-list-panel p-3 p-lg-4">
                <div class="management-toolbar mb-3">
                    <div><span class="management-eyebrow">PRODUCT GROUPS</span><h2 class="h5 fw-bold mb-0">Danh sách danh mục</h2></div>
                    <label class="input-group management-search" for="search-categories">
                        <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
                        <input class="form-control" id="search-categories" type="search" placeholder="Tìm tên hoặc mô tả..." aria-label="Tìm danh mục">
                    </label>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle management-table mb-0">
                        <thead><tr><th>Danh mục</th><th>Mô tả</th><th class="text-end">Số sản phẩm</th><th>Ngày tạo</th><th>Người tạo</th><th class="text-end" data-admin-only>Thao tác</th></tr></thead>
                        <tbody id="categories-table"><tr><td colspan="6" class="empty-state">Đang tải...</td></tr></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <div id="footer-container"></div>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="../../pages/categories/categories.js"></script>
</body>
</html>
