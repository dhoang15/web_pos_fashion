<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ cá nhân | B'TRIPLE POS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/custom.css">
</head>
<body class="app-shell" data-app-root="../.." data-page="profile" data-title="Hồ sơ cá nhân">
    <div id="header-container"></div><div class="app-layout"><div id="sidebar-container"></div>
        <main class="app-main flex-grow-1">
            <section class="page-heading"><h1>Hồ sơ cá nhân</h1><p>Cập nhật thông tin liên hệ và bảo mật tài khoản.</p></section>
            <div class="row g-4">
                <section class="col-lg-7">
                    <div class="surface-card p-3 p-lg-4">
                        <h2 class="h5 fw-bold mb-4">Thông tin cá nhân</h2>
                        <form id="profile-form">
                            <div class="d-flex align-items-center gap-3 mb-4">
                                <img id="avatar-preview" class="profile-avatar" alt="Ảnh đại diện" hidden>
                                <span id="avatar-placeholder" class="profile-avatar-placeholder" aria-hidden="true"><i class="bi bi-person"></i></span>
                                <div class="flex-grow-1"><label class="form-label fw-bold" for="profile-avatar">Avatar</label><input class="form-control" id="profile-avatar" type="file" accept="image/png,image/jpeg,image/webp"></div>
                            </div>
                            <div class="mb-3"><label class="form-label fw-bold" for="profile-name">Họ tên</label><input class="form-control" id="profile-name" name="name" autocomplete="name" required></div>
                            <div class="mb-4"><label class="form-label fw-bold" for="profile-phone">Số điện thoại</label><input class="form-control" id="profile-phone" name="phone" type="tel" autocomplete="tel"></div>
                            <button class="btn btn-brand" type="submit" id="save-profile">Lưu hồ sơ</button>
                        </form>
                    </div>
                </section>
                <section class="col-lg-5">
                    <div class="surface-card p-3 p-lg-4">
                        <h2 class="h5 fw-bold mb-4">Đổi mật khẩu</h2>
                        <form id="password-form">
                            <div class="mb-3"><label class="form-label" for="current-password">Mật khẩu hiện tại</label><input class="form-control" id="current-password" name="current_password" type="password" autocomplete="current-password" required></div>
                            <div class="mb-3"><label class="form-label" for="profile-new-password">Mật khẩu mới</label><input class="form-control" id="profile-new-password" name="password" type="password" minlength="8" autocomplete="new-password" required></div>
                            <div class="mb-4"><label class="form-label" for="profile-confirm-password">Xác nhận mật khẩu mới</label><input class="form-control" id="profile-confirm-password" name="password_confirmation" type="password" minlength="8" autocomplete="new-password" required></div>
                            <button class="btn btn-outline-dark" type="submit" id="change-profile-password">Cập nhật mật khẩu</button>
                        </form>
                    </div>
                </section>
            </div>
        </main>
    </div><div id="footer-container"></div><div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../../assets/js/api.js"></script><script src="../../assets/js/common.js"></script><script src="profile.js"></script>
</body>
</html>
