<!-- INVOICES VIEW (độc lập, không dùng chung code với view khác) -->
<div id="view-invoices" class="view-content hidden space-y-6 pl-2">

    <!-- Tiêu đề + Export / New Invoice -->
    <div class="bg-white dark:bg-darkcard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800/80">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <h3 data-i18n="ivc_title" class="text-xl font-extrabold text-gray-900 dark:text-white mb-1">Invoice Management</h3>
                <p data-i18n="ivc_subtitle" class="text-xs text-gray-400">Track and manage customer invoices</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="btnExportInvoices" data-act="export" type="button" class="px-5 py-3 rounded-2xl text-xs font-extrabold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <i class="fas fa-download mr-2"></i><span data-i18n="ivc_export">Export</span>
                </button>
                <button id="btnNewInvoice" data-act="new" type="button" class="px-6 py-3 rounded-2xl text-xs font-extrabold text-white bg-orange-500 hover:bg-orange-600 shadow-md shadow-orange-500/30 transition-colors">
                    <i class="fas fa-plus mr-2"></i><span data-i18n="ivc_new">New Invoice</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 4 thẻ thống kê -->
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="bg-white dark:bg-darkcard rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-800/80 flex items-center justify-between gap-4">
            <div class="min-w-0">
                <p data-i18n="ivc_stat_total" class="text-xs font-bold text-gray-500 dark:text-gray-400">Total Invoices</p>
                <p id="ivcStatTotal" class="text-2xl font-extrabold text-gray-900 dark:text-white mt-1 truncate">0</p>
            </div>
            <div class="w-12 h-12 flex-shrink-0 rounded-2xl bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 flex items-center justify-center"><i class="fas fa-file-lines text-lg"></i></div>
        </div>
        <div class="bg-white dark:bg-darkcard rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-800/80 flex items-center justify-between gap-4">
            <div class="min-w-0">
                <p data-i18n="ivc_stat_amount" class="text-xs font-bold text-gray-500 dark:text-gray-400">Total Amount</p>
                <p id="ivcStatAmount" class="text-2xl font-extrabold text-gray-900 dark:text-white mt-1 truncate">0 ₫</p>
            </div>
            <div class="w-12 h-12 flex-shrink-0 rounded-2xl bg-emerald-100 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400 flex items-center justify-center"><i class="fas fa-wallet text-lg"></i></div>
        </div>
        <div class="bg-white dark:bg-darkcard rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-800/80 flex items-center justify-between gap-4">
            <div class="min-w-0">
                <p data-i18n="ivc_stat_paid" class="text-xs font-bold text-gray-500 dark:text-gray-400">Paid Invoices</p>
                <p id="ivcStatPaid" class="text-2xl font-extrabold text-gray-900 dark:text-white mt-1 truncate">0</p>
            </div>
            <div class="w-12 h-12 flex-shrink-0 rounded-2xl bg-green-100 text-green-600 dark:bg-green-900/30 dark:text-green-400 flex items-center justify-center"><i class="fas fa-circle-check text-lg"></i></div>
        </div>
        <div class="bg-white dark:bg-darkcard rounded-3xl p-5 shadow-sm border border-gray-100 dark:border-gray-800/80 flex items-center justify-between gap-4">
            <div class="min-w-0">
                <p data-i18n="ivc_stat_overdue" class="text-xs font-bold text-gray-500 dark:text-gray-400">Overdue</p>
                <p id="ivcStatOverdue" class="text-2xl font-extrabold text-gray-900 dark:text-white mt-1 truncate">0</p>
            </div>
            <div class="w-12 h-12 flex-shrink-0 rounded-2xl bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 flex items-center justify-center"><i class="fas fa-triangle-exclamation text-lg"></i></div>
        </div>
    </div>

    <!-- Tìm kiếm + bộ lọc -->
    <div class="bg-white dark:bg-darkcard p-4 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800/80">
        <div class="flex flex-col md:flex-row gap-3">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input id="ivcSearch" type="text" placeholder="Search by invoice ID or customer..." autocomplete="off"
                    class="w-full pl-11 pr-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500">
            </div>
            <select id="ivcFilterStatus" aria-label="Status" class="ivc-select px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500 md:w-44"></select>
            <select id="ivcFilterTime" aria-label="Time" class="ivc-select px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500 md:w-44"></select>
        </div>
    </div>

    <!-- Bảng hóa đơn -->
    <div class="bg-white dark:bg-darkcard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800/80">
        <h4 id="ivcListTitle" class="text-base font-extrabold text-gray-900 dark:text-white mb-4">Invoices (0)</h4>
        <div class="overflow-x-auto">
            <table class="ivc-table w-full text-sm">
                <thead>
                    <tr>
                        <th data-i18n="ivc_col_id">Invoice ID</th>
                        <th data-i18n="ivc_col_customer">Customer</th>
                        <th data-i18n="ivc_col_date">Date</th>
                        <th data-i18n="ivc_col_amount">Amount</th>
                        <th data-i18n="ivc_col_items">Items</th>
                        <th data-i18n="ivc_col_payment">Payment</th>
                        <th data-i18n="ivc_col_status">Status</th>
                        <th data-i18n="ivc_col_actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="ivcBody"></tbody>
            </table>
            <p id="ivcEmpty" data-i18n="ivc_empty" class="hidden text-center text-gray-400 text-sm py-8">No invoices found.</p>
        </div>
    </div>

    <!-- ===== Modal: hóa đơn mới ===== -->
    <div id="ivcFormModal" class="hidden fixed inset-0 z-40 items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="ivcFormTitle">
        <div data-act="close-form" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
        <div class="ivc-modal-panel relative w-full max-w-lg max-h-full overflow-y-auto bg-white dark:bg-darkcard rounded-3xl p-6 sm:p-8 shadow-2xl border border-gray-100 dark:border-gray-800">
            <div class="flex items-start justify-between gap-4 mb-6">
                <h4 id="ivcFormTitle" data-i18n="ivc_form_title" class="text-lg font-extrabold text-gray-900 dark:text-white">New Invoice</h4>
                <button type="button" data-act="close-form" data-i18n-aria="ivc_close" aria-label="Close" class="ivc-icon-btn text-gray-400 hover:text-gray-700 dark:hover:text-gray-200"><i class="fas fa-times"></i></button>
            </div>

            <form id="ivcForm" novalidate class="space-y-4">
                <div>
                    <label for="ivcCustomer" data-i18n="ivc_f_customer" class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">Customer Name</label>
                    <input id="ivcCustomer" type="text" autocomplete="off" aria-describedby="ivcErrCustomer"
                        class="ivc-input w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500">
                    <p id="ivcErrCustomer" class="hidden text-xs font-semibold text-red-500 mt-1.5"></p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="ivcAmount" data-i18n="ivc_f_amount" class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">Amount (₫)</label>
                        <input id="ivcAmount" type="text" autocomplete="off" aria-describedby="ivcErrAmount" inputmode="numeric"
                            class="ivc-input w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500">
                        <p id="ivcErrAmount" class="hidden text-xs font-semibold text-red-500 mt-1.5"></p>
                    </div>
                    <div>
                        <label for="ivcItems" data-i18n="ivc_f_items" class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">Number of Items</label>
                        <input id="ivcItems" type="number" autocomplete="off" aria-describedby="ivcErrItems" min="1" step="1"
                            class="ivc-input w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500">
                        <p id="ivcErrItems" class="hidden text-xs font-semibold text-red-500 mt-1.5"></p>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="ivcPayment" data-i18n="ivc_f_payment" class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">Payment Method</label>
                        <select id="ivcPayment" class="ivc-select ivc-input w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500"></select>
                    </div>
                    <div>
                        <label for="ivcStatus" data-i18n="ivc_f_status" class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">Status</label>
                        <select id="ivcStatus" class="ivc-select ivc-input w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500"></select>
                    </div>
                </div>
                <div>
                    <label for="ivcDate" data-i18n="ivc_f_date" class="block text-xs font-bold text-gray-600 dark:text-gray-400 uppercase tracking-wider mb-2">Date</label>
                    <input id="ivcDate" type="date" autocomplete="off" aria-describedby="ivcErrDate"
                        class="ivc-input w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500">
                    <p id="ivcErrDate" class="hidden text-xs font-semibold text-red-500 mt-1.5"></p>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" data-i18n="ivc_create" class="flex-1 py-3 rounded-2xl text-sm font-extrabold text-white bg-orange-500 hover:bg-orange-600 shadow-md shadow-orange-500/30 transition-colors">Create Invoice</button>
                    <button type="button" data-act="close-form" data-i18n="ivc_cancel" class="px-6 py-3 rounded-2xl text-sm font-bold text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Modal: xem hóa đơn ===== -->
    <div id="ivcViewModal" class="hidden fixed inset-0 z-40 items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="ivcViewId">
        <div data-act="close-view" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
        <div class="ivc-modal-panel relative w-full max-w-md max-h-full overflow-y-auto bg-white dark:bg-darkcard rounded-3xl p-6 sm:p-8 shadow-2xl border border-gray-100 dark:border-gray-800">
            <button type="button" data-act="close-view" data-i18n-aria="ivc_close" aria-label="Close" class="ivc-icon-btn absolute top-5 right-5 text-gray-400 hover:text-gray-700 dark:hover:text-gray-200"><i class="fas fa-times"></i></button>

            <p data-i18n="ivc_v_title" class="text-xs font-bold text-gray-400 uppercase tracking-wider">Invoice Details</p>
            <div class="flex items-center gap-3 mt-1 mb-6 pr-8">
                <h4 id="ivcViewId" class="text-xl font-extrabold text-gray-900 dark:text-white"></h4>
                <span id="ivcViewStatus" class="ivc-badge"></span>
            </div>

            <div class="rounded-2xl bg-gray-50 dark:bg-gray-800/50 p-4 text-center mb-5">
                <p data-i18n="ivc_col_amount" class="text-[11px] font-bold text-gray-500 dark:text-gray-400">Amount</p>
                <p id="ivcViewAmount" class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1 break-words"></p>
            </div>

            <dl class="space-y-3 text-sm">
                <div class="flex justify-between gap-4"><dt data-i18n="ivc_col_customer" class="text-gray-500 dark:text-gray-400 font-semibold">Customer</dt><dd id="ivcViewCustomer" class="font-bold text-gray-900 dark:text-white text-right"></dd></div>
                <div class="flex justify-between gap-4"><dt data-i18n="ivc_col_date" class="text-gray-500 dark:text-gray-400 font-semibold">Date</dt><dd id="ivcViewDate" class="font-bold text-gray-900 dark:text-white"></dd></div>
                <div class="flex justify-between gap-4"><dt data-i18n="ivc_col_items" class="text-gray-500 dark:text-gray-400 font-semibold">Items</dt><dd id="ivcViewItems" class="font-bold text-gray-900 dark:text-white"></dd></div>
                <div class="flex justify-between gap-4 items-center"><dt data-i18n="ivc_col_payment" class="text-gray-500 dark:text-gray-400 font-semibold">Payment</dt><dd><span id="ivcViewPayment" class="ivc-badge"></span></dd></div>
            </dl>

            <div class="grid grid-cols-2 gap-3 pt-6">
                <button type="button" data-act="download-from-view" class="py-3 rounded-2xl text-sm font-bold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <i class="fas fa-download mr-2"></i><span data-i18n="ivc_download_btn">Download</span>
                </button>
                <button type="button" data-act="send-from-view" class="py-3 rounded-2xl text-sm font-bold text-gray-700 dark:text-gray-200 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                    <i class="far fa-paper-plane mr-2"></i><span data-i18n="ivc_send_btn">Send</span>
                </button>
            </div>
            <button id="ivcMarkPaid" type="button" data-act="mark-paid" class="hidden w-full mt-3 py-3 rounded-2xl text-sm font-extrabold text-white bg-orange-500 hover:bg-orange-600 shadow-md shadow-orange-500/30 transition-colors">
                <i class="fas fa-check mr-2"></i><span data-i18n="ivc_mark_paid">Mark as Paid</span>
            </button>
        </div>
    </div>

</div>
