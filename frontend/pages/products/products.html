<!-- PRODUCTS / ITEMS VIEW (độc lập, không dùng chung code với view khác) -->
<div id="view-products" class="view-content hidden space-y-6 pl-2">

    <!-- Tiêu đề + Import / Export / Thêm -->
    <div class="bg-white dark:bg-darkcard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800/80">
        <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
                <h3 data-i18n="prod_title" class="text-xl font-extrabold text-gray-900 dark:text-white mb-1">Products & Inventory</h3>
                <p data-i18n="prod_subtitle" class="text-xs text-gray-400">Manage your store's product catalog</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <button id="prodImport" data-act="import" type="button" class="prod-btn-secondary">
                    <i class="fas fa-upload mr-2"></i><span data-i18n="prod_import">Import CSV</span>
                </button>
                <button id="prodExport" data-act="export" type="button" class="prod-btn-secondary">
                    <i class="fas fa-download mr-2"></i><span data-i18n="prod_export">Export</span>
                </button>
                <button id="btnAddProduct" data-act="add" type="button" class="px-6 py-3 rounded-2xl text-xs font-extrabold text-white bg-orange-500 hover:bg-orange-600 shadow-md shadow-orange-500/30 transition-colors">
                    <i class="fas fa-plus mr-2"></i><span data-i18n="prod_add">Add Product</span>
                </button>
                <input id="prodImportFile" type="file" accept=".csv,text/csv" class="hidden" tabindex="-1">
            </div>
        </div>
    </div>

    <!-- Thông báo kết quả (import / lỗi lưu) -->
    <div id="prodNotice" role="status" aria-live="polite" class="hidden items-start justify-between gap-3 px-5 py-4 rounded-2xl text-sm font-semibold">
        <span id="prodNoticeText"></span>
        <button type="button" data-act="close-notice" data-i18n-aria="prod_close" aria-label="Close" class="flex-shrink-0 opacity-60 hover:opacity-100"><i class="fas fa-times"></i></button>
    </div>

    <!-- Tìm kiếm + lọc danh mục -->
    <div class="bg-white dark:bg-darkcard p-4 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800/80">
        <div class="flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input id="prodSearch" type="text" placeholder="Search products..." autocomplete="off"
                    class="w-full pl-11 pr-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500">
            </div>
            <select id="prodCategory" data-i18n-aria="prod_f_category" aria-label="Category"
                class="prod-select sm:w-56 px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500"></select>
        </div>
    </div>

    <!-- Bảng sản phẩm -->
    <div class="bg-white dark:bg-darkcard p-6 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800/80">
        <h4 id="prodListTitle" class="text-base font-extrabold text-gray-900 dark:text-white mb-4">Products (0)</h4>
        <div class="overflow-x-auto">
            <table class="prod-table w-full text-sm">
                <thead>
                    <tr>
                        <th data-i18n="prod_col_name">Product Name</th>
                        <th data-i18n="prod_col_category">Category</th>
                        <th data-i18n="prod_col_price">Price</th>
                        <th data-i18n="prod_col_stock">Stock</th>
                        <th data-i18n="prod_col_status">Status</th>
                        <th data-i18n="prod_col_actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="prodBody"></tbody>
            </table>
            <p id="prodEmpty" data-i18n="prod_empty" class="hidden text-center text-gray-400 text-sm py-8">No products found.</p>
        </div>
    </div>

    <!-- ===== Modal: thêm / sửa sản phẩm ===== -->
    <div id="prodModal" class="hidden fixed inset-0 z-40 items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="prodFormTitle">
        <div data-act="close-form" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
        <div class="prod-modal-panel relative w-full max-w-lg max-h-full overflow-y-auto bg-white dark:bg-darkcard rounded-3xl p-6 sm:p-8 shadow-2xl border border-gray-100 dark:border-gray-800">
            <div class="flex items-start justify-between gap-4 mb-6">
                <h4 id="prodFormTitle" class="text-lg font-extrabold text-gray-900 dark:text-white">Add Product</h4>
                <button type="button" data-act="close-form" data-i18n-aria="prod_close" aria-label="Close" class="prod-icon-btn"><i class="fas fa-times"></i></button>
            </div>

            <form id="prodForm" novalidate class="space-y-4">
                <!-- Ảnh sản phẩm -->
                <div class="flex items-center gap-4">
                    <div id="prodImgPreview" class="prod-thumb prod-thumb-lg"></div>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" data-act="pick-image" class="prod-btn-secondary !px-4 !py-2.5">
                            <i class="far fa-image mr-2"></i><span data-i18n="prod_img_choose">Choose image</span>
                        </button>
                        <button id="prodImgRemove" type="button" data-act="remove-image" class="hidden px-4 py-2.5 rounded-2xl text-xs font-bold text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors">
                            <span data-i18n="prod_img_remove">Remove</span>
                        </button>
                        <input id="prodImgFile" type="file" accept="image/*" class="hidden" tabindex="-1">
                    </div>
                </div>
                <p id="prodErrImg" class="hidden text-xs font-semibold text-red-500 -mt-2"></p>

                <div>
                    <label for="prodName" data-i18n="prod_f_name" class="prod-label">Product Name</label>
                    <input id="prodName" type="text" autocomplete="off" aria-describedby="prodErrName" class="prod-input">
                    <p id="prodErrName" class="hidden text-xs font-semibold text-red-500 mt-1.5"></p>
                </div>

                <div>
                    <label for="prodCat" data-i18n="prod_f_category" class="prod-label">Category</label>
                    <input id="prodCat" type="text" list="prodCatList" autocomplete="off" aria-describedby="prodErrCat" class="prod-input">
                    <datalist id="prodCatList"></datalist>
                    <p id="prodErrCat" class="hidden text-xs font-semibold text-red-500 mt-1.5"></p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="prodPrice" data-i18n="prod_f_price" class="prod-label">Price (₫)</label>
                        <input id="prodPrice" type="text" inputmode="numeric" autocomplete="off" aria-describedby="prodErrPrice" class="prod-input">
                        <p id="prodErrPrice" class="hidden text-xs font-semibold text-red-500 mt-1.5"></p>
                    </div>
                    <div>
                        <label for="prodStock" data-i18n="prod_f_stock" class="prod-label">Stock</label>
                        <input id="prodStock" type="text" inputmode="numeric" autocomplete="off" aria-describedby="prodErrStock" class="prod-input">
                        <p id="prodErrStock" class="hidden text-xs font-semibold text-red-500 mt-1.5"></p>
                    </div>
                </div>

                <div>
                    <label for="prodDesc" data-i18n="prod_f_desc" class="prod-label">Description (Optional)</label>
                    <textarea id="prodDesc" rows="2" class="prod-input resize-none"></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button id="prodSubmit" type="submit" class="flex-1 py-3 rounded-2xl text-sm font-extrabold text-white bg-orange-500 hover:bg-orange-600 shadow-md shadow-orange-500/30 transition-colors">Add Product</button>
                    <button type="button" data-act="close-form" data-i18n="prod_cancel" class="px-6 py-3 rounded-2xl text-sm font-bold text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Cancel</button>
                </div>
            </form>
        </div>
    </div>

</div>
