<!-- POS / SALES VIEW (độc lập, không dùng chung code với view khác) -->
<div id="view-pos" class="view-content hidden xl:h-full pl-2">
    <div class="grid grid-cols-1 xl:grid-cols-[minmax(0,1fr)_390px] gap-6 xl:h-full">

        <!-- ===== Cột trái: danh sách sản phẩm ===== -->
        <section class="flex flex-col min-w-0 xl:min-h-0 bg-white dark:bg-darkcard rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800/80 p-6 xl:p-8">
            <div class="flex flex-wrap items-end justify-between gap-4 mb-7 flex-shrink-0">
                <div>
                    <h3 data-i18n="pos_title" class="text-xl font-extrabold text-gray-900 dark:text-white mb-1">New sale</h3>
                    <p data-i18n="pos_subtitle" class="text-xs text-gray-400">Pick products and build the order</p>
                </div>
                <div class="relative w-full sm:w-72">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input id="posSearch" type="text" placeholder="Search products..." autocomplete="off"
                        class="w-full pl-10 pr-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500">
                </div>
            </div>

            <!-- Tabs danh mục (JS render) -->
            <div id="posTabs" class="flex items-center gap-3 overflow-x-auto pb-1 mb-7 flex-shrink-0"></div>

            <!-- Lưới sản phẩm (cuộn riêng trên màn hình lớn) -->
            <div class="xl:flex-1 xl:min-h-0 xl:overflow-y-auto xl:-mr-3 xl:pr-3">
                <div id="posGrid" class="grid grid-cols-[repeat(auto-fill,minmax(260px,1fr))] gap-5 pb-2"></div>
                <p id="posEmpty" data-i18n="pos_no_results" class="hidden text-center text-gray-400 text-sm py-12">No products found.</p>
            </div>
        </section>

        <!-- ===== Cột phải: chi tiết đơn hàng ===== -->
        <aside class="bg-white dark:bg-darkcard rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800/80 flex flex-col xl:min-h-0 overflow-hidden">
            <div class="flex items-center justify-between gap-3 px-7 pt-7 pb-5 flex-shrink-0">
                <div>
                    <h4 data-i18n="pos_cart_title" class="text-base font-extrabold text-gray-900 dark:text-white">Order details</h4>
                    <p id="posCartCount" class="text-xs text-gray-400 mt-0.5">0 items</p>
                </div>
                <button id="posClear" data-act="clear" type="button" class="text-xs font-bold text-gray-400 hover:text-red-500 transition-colors">
                    <i class="fas fa-trash-alt mr-1"></i><span data-i18n="pos_clear">Clear all</span>
                </button>
            </div>

            <!-- Danh sách món trong giỏ (JS render) -->
            <div id="posCartList" class="flex-1 min-h-[180px] xl:min-h-0 overflow-y-auto px-7"></div>

            <div class="px-7 pt-5 pb-7 border-t border-gray-100 dark:border-gray-800 flex-shrink-0 space-y-4">
                <!-- Mã giảm giá -->
                <div>
                    <div class="flex items-center gap-2">
                        <div class="relative flex-1">
                            <i class="fas fa-tag absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                            <input id="posPromo" type="text" placeholder="Promo code" autocomplete="off"
                                class="w-full pl-10 pr-3 py-2.5 rounded-2xl bg-gray-50 dark:bg-gray-800/60 border border-gray-200 dark:border-gray-700 text-sm font-semibold focus:outline-none focus:border-orange-500">
                        </div>
                        <button id="posPromoApply" data-act="promo-apply" type="button" data-i18n="pos_promo_apply"
                            class="px-4 py-2.5 rounded-2xl text-xs font-extrabold text-orange-600 bg-orange-100 dark:bg-orange-900/40 dark:text-orange-400 hover:bg-orange-200 dark:hover:bg-orange-900/60 transition-colors">Apply</button>
                    </div>
                    <p id="posPromoMsg" class="hidden text-xs font-semibold mt-2 px-1"></p>
                </div>

                <!-- Tổng kết -->
                <dl class="space-y-2.5 text-sm">
                    <div class="flex justify-between">
                        <dt data-i18n="pos_subtotal" class="text-gray-500 dark:text-gray-400 font-semibold">Subtotal</dt>
                        <dd id="posSubtotal" class="font-bold text-gray-800 dark:text-gray-200">0 ₫</dd>
                    </div>
                    <div class="flex justify-between">
                        <dt id="posTaxLabel" class="text-gray-500 dark:text-gray-400 font-semibold">VAT (10%)</dt>
                        <dd id="posTax" class="font-bold text-gray-800 dark:text-gray-200">0 ₫</dd>
                    </div>
                    <div class="flex justify-between">
                        <dt data-i18n="pos_discount" class="text-gray-500 dark:text-gray-400 font-semibold">Discount</dt>
                        <dd id="posDiscount" class="font-bold text-emerald-600 dark:text-emerald-400">0 ₫</dd>
                    </div>
                    <div class="flex justify-between items-baseline pt-3 border-t border-dashed border-gray-200 dark:border-gray-700">
                        <dt data-i18n="pos_total" class="font-extrabold text-gray-900 dark:text-white">Total payment</dt>
                        <dd id="posTotal" class="text-xl font-extrabold text-orange-600 dark:text-orange-400">0 ₫</dd>
                    </div>
                </dl>

                <!-- Phương thức thanh toán -->
                <div class="grid grid-cols-3 gap-2.5">
                    <button type="button" data-act="pay" data-method="cash" class="pos-pay flex items-center justify-center gap-2 py-2.5 rounded-2xl text-xs font-bold border transition-colors">
                        <i class="fas fa-money-bill-wave text-sm"></i><span data-i18n="pos_pay_cash">Cash</span>
                    </button>
                    <button type="button" data-act="pay" data-method="card" class="pos-pay flex items-center justify-center gap-2 py-2.5 rounded-2xl text-xs font-bold border transition-colors">
                        <i class="fas fa-credit-card text-sm"></i><span data-i18n="pos_pay_card">Card</span>
                    </button>
                    <button type="button" data-act="pay" data-method="transfer" class="pos-pay flex items-center justify-center gap-2 py-2.5 rounded-2xl text-xs font-bold border transition-colors">
                        <i class="fas fa-qrcode text-sm"></i><span data-i18n="pos_pay_transfer">Transfer</span>
                    </button>
                </div>

                <button id="posCheckout" data-act="checkout" type="button" disabled
                    class="w-full py-3.5 rounded-2xl text-sm font-extrabold text-white bg-orange-500 hover:bg-orange-600 shadow-md shadow-orange-500/30 transition-colors disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none disabled:hover:bg-orange-500">
                    <i class="fas fa-check-circle mr-2"></i><span data-i18n="pos_checkout">Place order</span>
                </button>
            </div>
        </aside>

    </div>
</div>
