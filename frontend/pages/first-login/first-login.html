<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo Mật Khẩu Mới | B'TRIPLE POS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/fonts.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../login/login.css">
</head>
<body>

    <div class="container-fluid p-0">
        <div class="row g-0 vh-100">
            
            <!-- Cột trái: Hình nền -->
            <div class="col-lg-6 d-none d-lg-flex position-relative bg-dark banner-section align-items-center justify-content-center">
                <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50 z-1"></div>
                <div class="position-relative z-2 text-white text-center p-5">
                    <h2 class="font-serif display-4 fw-bold mb-3 tracking-wide">B'TRIPLE</h2>
                    <p class="font-sans small fw-light text-uppercase tracking-widest opacity-75">Bảo mật là ưu tiên hàng đầu</p>
                </div>
            </div>

            <!-- Cột phải: Form Đặt lại mật khẩu -->
            <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white p-4 p-sm-5">
                <div class="w-100 form-container">
                    
                    <div class="mb-5">
                        <h1 class="font-serif fs-2 fw-bold mb-2">Tạo mật khẩu mới</h1>
                        <p class="text-secondary small font-sans">Mã xác minh hợp lệ. Vui lòng tạo mật khẩu mới cho tài khoản của bạn.</p>
                    </div>

                    <form action="../login/login.html" method="POST">
                        
                        <!-- Input Mật khẩu mới -->
                        <div class="mb-4">
                            <label for="new_password" class="form-label text-secondary small fw-semibold text-uppercase tracking-wider">Mật khẩu mới</label>
                            <div class="input-group input-group-fashion">
                                <span class="input-group-text bg-transparent border-0 border-bottom rounded-0 text-secondary">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input type="password" id="new_password" name="new_password" class="form-control border-0 border-bottom rounded-0 shadow-none px-2" placeholder="Tối thiểu 8 ký tự" required>
                                <button class="btn border-0 border-bottom rounded-0 text-secondary toggle-pwd" type="button" data-target="new_password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Input Xác nhận mật khẩu -->
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label text-secondary small fw-semibold text-uppercase tracking-wider">Xác nhận mật khẩu</label>
                            <div class="input-group input-group-fashion">
                                <span class="input-group-text bg-transparent border-0 border-bottom rounded-0 text-secondary">
                                    <i class="bi bi-shield-check"></i>
                                </span>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control border-0 border-bottom rounded-0 shadow-none px-2" placeholder="Nhập lại mật khẩu mới" required>
                                <button class="btn border-0 border-bottom rounded-0 text-secondary toggle-pwd" type="button" data-target="confirm_password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Nút Submit -->
                        <button type="submit" class="btn btn-dark w-100 rounded-0 py-3 fw-bold tracking-wider text-uppercase mt-2 mb-4">
                            Lưu Mật Khẩu
                        </button>

                    </form>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Script Javascript ẩn hiện nhiều mật khẩu -->
    <script src="./first-login.js">
    </script>
</body>
</html>
