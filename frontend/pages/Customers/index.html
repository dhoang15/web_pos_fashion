<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Khách hàng | B'TRIPLE POS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/custom.css">
    <link rel="stylesheet" href="customers.css">
</head>
<body class="app-shell" data-app-root="../.." data-page="customers" data-title="Khách hàng">
    <div id="header-container"></div>
    <div class="app-layout">
        <div id="sidebar-container"></div>
        <main class="app-main flex-grow-1">
            <section class="page-heading">
                <h1>Khách hàng</h1>
                <p>Thông tin khách hàng được lưu khi phát sinh giao dịch tại quầy POS.</p>
            </section>
            <section class="surface-card p-3 p-lg-4" aria-labelledby="customer-list-title">
                <div class="customer-list-heading">
                    <h2 class="h5 fw-bold mb-0" id="customer-list-title">Danh sách khách hàng</h2>
                    <label class="visually-hidden" for="search-customers">Tìm khách hàng</label>
                    <input id="search-customers" class="form-control customer-search-input" type="search" placeholder="Tìm tên, số điện thoại, địa chỉ...">
                </div>
                <p id="customers-status" class="status-message" aria-live="polite">Đang tải danh sách...</p>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead><tr><th>Khách hàng</th><th>Số điện thoại</th><th>Địa chỉ</th><th>Ngày tạo</th><th class="text-end">Số đơn</th><th class="text-end">Tổng mua</th><th class="text-end">Lịch sử</th></tr></thead>
                        <tbody id="customers-table"><tr><td colspan="7" class="empty-state">Đang tải...</td></tr></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <div id="footer-container"></div>
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" aria-live="polite"></div>

    <div class="modal fade" id="customer-history-modal" tabindex="-1" aria-labelledby="customer-history-title" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 rounded-4">
                <div class="modal-header">
                    <div><h2 class="modal-title fs-5 fw-bold" id="customer-history-title">Lịch sử khách hàng</h2><p id="customer-history-summary" class="small text-muted mb-0"></p></div>
                    <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    <p id="customer-history-status" class="status-message" aria-live="polite">Đang tải lịch sử...</p>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead><tr><th>Mã đơn</th><th>Ngày giờ</th><th class="text-end">Sản phẩm</th><th class="text-end">Tổng tiền</th><th class="text-end">Khách đưa</th><th class="text-end">Tiền thừa</th><th></th></tr></thead>
                            <tbody id="customer-orders-table"></tbody>
                        </table>
                    </div>
                    <section id="customer-order-detail" class="customer-order-detail" aria-live="polite" hidden></section>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/common.js"></script>
    <script src="customers.js"></script>
</body>
</html>
