<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | B'TRIPLE POS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/custom.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-brand-panel">
            <div><h2 class="font-serif fw-bold mt-3">B'TRIPLE</h2></div>
        </section>
        <section class="auth-form-panel">
            <div class="auth-form">
                <h1 class="font-serif fw-bold mt-4">Chào mừng trở lại</h1>
                <p class="text-muted mb-4">Đăng nhập để tiếp tục đến cửa hàng của bạn.</p>
                <div id="invitation-status" class="alert alert-info auth-error" role="status" aria-live="polite" hidden></div>
                <div id="login-error" class="alert alert-danger auth-error" role="alert" aria-live="polite"></div>
                <form id="login-form">
                    <div class="mb-3"><label class="form-label fw-bold" for="username">Tên đăng nhập</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
                    <div class="mb-4"><label class="form-label fw-bold" for="password">Mật khẩu</label><div class="input-group"><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Hiện mật khẩu"><i class="bi bi-eye"></i></button></div></div>
                    <button class="btn btn-brand w-100 py-3 fw-bold" type="submit" id="login-submit">Đăng nhập</button>
                </form>
                <p id="temporary-password-hint" class="small text-muted mt-4" hidden>Nhân viên mới dùng mật khẩu tạm thời là mã số sinh viên của trưởng nhóm viết thường. Sau khi đăng nhập, bạn sẽ được yêu cầu tạo mật khẩu mới.</p>
                <p class="small text-muted mt-4" id="login-help">Nhân viên mới cần mở trang này từ liên kết trong email còn hiệu lực 1 phút.</p>
            </div>
        </section>
    </main>
    <script src="../../assets/js/api.js"></script>
    <script src="login.js"></script>
</body>
</html>
