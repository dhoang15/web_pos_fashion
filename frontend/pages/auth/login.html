<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | B'TRIPLE POS</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS tùy chỉnh (Đã sửa đường dẫn tương đối) -->
    <link rel="stylesheet" href="../../assets/styles/login.css">
</head>
<body>

    <div class="container-fluid p-0">
        <div class="row g-0 vh-100">
            
            <!-- Cột trái: Hình nền -->
            <div class="col-lg-6 d-none d-lg-flex position-relative bg-dark banner-section align-items-center justify-content-center">
                <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark opacity-50 z-1"></div>
                
                <div class="position-relative z-2 text-white text-center p-5">
                    <h2 class="font-serif display-4 fw-bold mb-3 tracking-wide">B'TRIPLE</h2>
                    <p class="font-sans small fw-light text-uppercase tracking-widest opacity-75">Định hình phong cách của bạn</p>
                </div>
            </div>

            <!-- Cột phải: Form Đăng nhập -->
            <div class="col-lg-6 d-flex align-items-center justify-content-center bg-white p-4 p-sm-5">
                <div class="w-100 form-container">
                    
                    <!-- Tiêu đề trên Mobile -->
                    <div class="d-block d-lg-none text-center mb-5">
                        <h2 class="font-serif fs-2 fw-bold text-dark">B'TRIPLE</h2>
                    </div>

                    <!-- Header Form -->
                    <div class="mb-5">
                        <h1 class="font-serif fs-2 fw-bold mb-2">Chào mừng trở lại!</h1>
                        <p class="text-secondary small font-sans">Nhập thông tin đăng nhập để truy cập bảng điều khiển</p>
                    </div>

                    <form action="#" method="POST">
                        <!-- Input Tên Đăng Nhập -->
                        <div class="mb-4">
                            <label for="username" class="form-label text-secondary small fw-semibold text-uppercase tracking-wider">Tên Đăng Nhập</label>
                            <div class="input-group input-group-fashion">
                                <span class="input-group-text bg-transparent border-0 border-bottom rounded-0 text-secondary">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" id="username" name="username" class="form-control border-0 border-bottom rounded-0 shadow-none px-2" placeholder="Nhập tên đăng nhập" required>                      
                            </div> <!-- Đã bổ sung thẻ đóng </div> còn thiếu ở đây -->
                        </div>

                        <!-- Input Mật khẩu -->
                        <div class="mb-4">
                            <label for="password" class="form-label text-secondary small fw-semibold text-uppercase tracking-wider">Mật khẩu</label>
                            <div class="input-group input-group-fashion">
                                <span class="input-group-text bg-transparent border-0 border-bottom rounded-0 text-secondary">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" id="password" name="password" class="form-control border-0 border-bottom rounded-0 shadow-none px-2" placeholder="Nhập mật khẩu" required>
                                <button class="btn border-0 border-bottom rounded-0 text-secondary" type="button" id="togglePassword">
                                    <i class="bi bi-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Ghi nhớ & Quên mật khẩu -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input border-secondary shadow-none cursor-pointer" type="checkbox" id="remember-me">
                                <label class="form-check-label small text-secondary cursor-pointer" for="remember-me">
                                    Ghi nhớ đăng nhập
                                </label>
                            </div>
                        </div>

                        <!-- Nút Submit -->
                        <button type="submit" class="btn btn-dark w-100 rounded-0 py-3 fw-bold tracking-wider text-uppercase">
                            Đăng Nhập
                        </button>
                    </form>

                    <!-- Thông tin Demo -->
                    <div class="mt-5 text-center">
                        <div class="small text-secondary bg-light p-3 border">
                            <strong>Tài Khoản Demo:</strong><br>
                            Admin: admin / admin123<br>
                            Staff: staff / staff123<br>
                            Cashier: cashier / cashier123
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Script Javascript -->
    <script src="../../assets/js/login.js"></script>
</body>
</html>
