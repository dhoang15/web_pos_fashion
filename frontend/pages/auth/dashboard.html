<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B'TRIPLE - Modern Skeleton Dashboard</title>
    
    <!-- Google Font: Nunito -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class', // Enables dark mode toggling via 'dark' class on HTML tag
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'sans-serif'], // Apply Nunito as default
                    },
                    colors: {
                        darkbg: '#121212',
                        darkcard: '#1e1e1e',
                    }
                }
            }
        }
    </script>

    <style>
        /* Smooth transitions for theme switching */
        * {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        /* Hide scrollbar for clean look */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>

<body class="bg-[#F3F4F6] dark:bg-darkbg text-gray-800 dark:text-gray-200 font-sans h-screen flex overflow-hidden selection:bg-orange-500 selection:text-white">

    <!-- Sidebar -->
    <aside class="w-64 p-6 flex flex-col gap-4 flex-shrink-0">
        
        <!-- Logo -->
        <div class="mb-6 flex items-center gap-3 px-2">
            <i class="fas fa-basketball-ball text-3xl text-orange-500"></i>
            <h1 class="font-extrabold text-2xl tracking-wider text-gray-900 dark:text-white uppercase italic">B'Triple</h1>
        </div>

        <!-- Navigation Menu -->
        <nav class="flex-1 flex flex-col gap-2 overflow-y-auto pr-2 pb-6">
            <!-- Active Item (POS) -->
            <a href="#" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl bg-orange-100 text-orange-600 dark:bg-orange-900/40 dark:text-orange-400 font-bold shadow-sm">
                <i class="fas fa-cash-register w-5 text-center text-lg"></i>
                <span class="tracking-wide">POS / Sales</span>
            </a>
            
            <!-- Inactive Items -->
            <a href="#" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-gray-800 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-darkcard font-semibold transition-all">
                <i class="fas fa-th-large w-5 text-center text-lg"></i>
                <span class="tracking-wide">Dashboard</span>
            </a>
            
            <a href="#" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-gray-800 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-darkcard font-semibold transition-all">
                <i class="fas fa-file-invoice w-5 text-center text-lg"></i>
                <span class="tracking-wide">Invoices</span>
            </a>
            
            <a href="#" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-gray-800 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-darkcard font-semibold transition-all">
                <i class="fas fa-users w-5 text-center text-lg"></i>
                <span class="tracking-wide">Customers & HR</span>
            </a>
            
            <a href="#" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-gray-800 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-darkcard font-semibold transition-all">
                <i class="fas fa-tshirt w-5 text-center text-lg"></i>
                <span class="tracking-wide">Products / Items</span>
            </a>
            
            <a href="#" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-gray-800 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-darkcard font-semibold transition-all">
                <i class="fas fa-shopping-bag w-5 text-center text-lg"></i>
                <span class="tracking-wide">Purchases</span>
            </a>
            
            <a href="#" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-gray-800 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-darkcard font-semibold transition-all">
                <i class="fas fa-chart-pie w-5 text-center text-lg"></i>
                <span class="tracking-wide">Reports</span>
            </a>
            
            <a href="../../pages/auth/login.html" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-gray-800 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-darkcard font-semibold transition-all mt-auto">
                <i class="fas fa-cog w-5 text-center text-lg"></i>
                <span class="tracking-wide">Settings</span>
            </a>
            
            <a href="#" class="flex items-center gap-4 px-5 py-3.5 rounded-2xl text-gray-500 hover:text-gray-800 hover:bg-gray-200 dark:text-gray-400 dark:hover:text-gray-100 dark:hover:bg-darkcard font-semibold transition-all">
                <i class="fas fa-question-circle w-5 text-center text-lg"></i>
                <span class="tracking-wide">Help</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col p-6 pl-0 h-screen">
        
        <!-- Top Toolbar & Header -->
        <header class="flex justify-between items-center mb-6">
            <!-- Greeting -->
            <div class="px-2">
                <h2 class="text-2xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                    Welcome, Admin <span class="text-xl inline-block animate-wave">👋</span>
                </h2>
                <p class="text-gray-500 dark:text-gray-400 text-sm font-medium mt-1">Here's what happening in your store.</p>
            </div>

            <!-- Toolbar Actions (Pill shape) -->
            <div class="flex items-center gap-5 bg-white dark:bg-darkcard px-6 py-2.5 rounded-full shadow-sm border border-gray-100 dark:border-gray-800">
                <button class="text-gray-400 hover:text-orange-500 dark:hover:text-orange-400 transition-colors">
                    <i class="fas fa-search text-lg"></i>
                </button>
                
                <!-- Dark Mode Toggle Button -->
                <button id="themeToggle" class="text-gray-400 hover:text-orange-500 dark:hover:text-orange-400 transition-colors w-6 flex justify-center">
                    <i id="themeIcon" class="fas fa-moon text-lg"></i>
                </button>
                
                <button class="text-gray-400 hover:text-orange-500 dark:hover:text-orange-400 transition-colors relative">
                    <i class="fas fa-bell text-lg"></i>
                    <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 border-2 border-white dark:border-darkcard rounded-full"></span>
                </button>
                
                <button class="text-gray-400 hover:text-orange-500 dark:hover:text-orange-400 transition-colors">
                    <i class="fas fa-calendar-alt text-lg"></i>
                </button>
                
                <div class="pl-2 border-l border-gray-200 dark:border-gray-700">
                    <img src="https://i.pravatar.cc/150?img=12" alt="Admin Avatar" class="w-9 h-9 rounded-full border-2 border-orange-100 dark:border-orange-900 cursor-pointer hover:opacity-80">
                </div>
            </div>
        </header>

        <!-- Empty Workspace (Main Content Placeholder) -->
        <div class="flex-1 bg-white/60 dark:bg-darkcard/50 border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-3xl flex flex-col items-center justify-center shadow-sm backdrop-blur-sm">
            <div class="w-24 h-24 bg-gray-100 dark:bg-gray-800 rounded-full flex items-center justify-center mb-4 text-gray-300 dark:text-gray-600">
                <i class="fas fa-layer-group text-4xl"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-600 dark:text-gray-300 mb-2">Workspace Ready</h3>
            <p class="text-gray-400 dark:text-gray-500 font-medium text-sm text-center max-w-sm">
                This area is currently empty. You can inject your Dashboard widgets or POS components here.
            </p>
        </div>
    </main>

    <!-- Scripts for Interaction -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggleBtn = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const htmlElement = document.documentElement;

            // Function to set theme
            const setTheme = (isDark) => {
                if (isDark) {
                    htmlElement.classList.add('dark');
                    themeIcon.classList.remove('fa-moon');
                    themeIcon.classList.add('fa-sun');
                    localStorage.setItem('theme', 'dark');
                } else {
                    htmlElement.classList.remove('dark');
                    themeIcon.classList.remove('fa-sun');
                    themeIcon.classList.add('fa-moon');
                    localStorage.setItem('theme', 'light');
                }
            };

            // 1. Check local storage
            // 2. If nothing in local storage, check system preference
            if (localStorage.getItem('theme') === 'dark' || 
                (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                setTheme(true);
            } else {
                setTheme(false);
            }

            // Listen for toggle button click
            themeToggleBtn.addEventListener('click', () => {
                const isDarkModeNow = htmlElement.classList.contains('dark');
                setTheme(!isDarkModeNow);
            });
            
            // Animation for wave emoji on hover
            const waveEmoji = document.querySelector('.animate-wave');
            if(waveEmoji) {
                waveEmoji.parentElement.addEventListener('mouseenter', () => {
                    waveEmoji.style.transform = 'rotate(20deg)';
                    setTimeout(() => waveEmoji.style.transform = 'rotate(-10deg)', 150);
                    setTimeout(() => waveEmoji.style.transform = 'rotate(10deg)', 300);
                    setTimeout(() => waveEmoji.style.transform = 'rotate(0deg)', 450);
                });
                waveEmoji.parentElement.addEventListener('mouseleave', () => {
                    waveEmoji.style.transform = 'rotate(0deg)';
                });
            }
        });
    </script>
</body>
</html>
