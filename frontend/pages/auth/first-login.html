<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu | B'TRIPLE POS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../assets/css/variables.css">
    <link rel="stylesheet" href="../../assets/css/base.css">
    <link rel="stylesheet" href="../../assets/css/custom.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-brand-panel"><div><h2 class="font-serif fw-bold mt-3">B'TRIPLE</h2></div></section>
        <section class="auth-form-panel">
            <div class="auth-form">
                <h1 class="font-serif fw-bold" id="first-login-title">Đổi mật khẩu</h1>
                <p class="text-muted mb-4" id="first-login-description">Tạo mật khẩu mới để tiếp tục sử dụng ứng dụng.</p>
                <div id="password-error" class="alert alert-danger auth-error" role="alert" aria-live="polite"></div>
                <form id="first-login-form">
                    <div class="mb-3"><label class="form-label fw-bold" for="new-password">Mật khẩu mới</label><input class="form-control" id="new-password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div>
                    <div class="mb-4"><label class="form-label fw-bold" for="confirm-password">Xác nhận mật khẩu</label><input class="form-control" id="confirm-password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div>
                    <button class="btn btn-brand w-100 py-3 fw-bold" type="submit" id="change-password-submit">Lưu mật khẩu</button>
                </form>
                <button class="btn btn-link text-danger w-100 mt-3" type="button" id="first-login-logout">Đăng xuất</button>
            </div>
        </section>
    </main>
    <script src="../../assets/js/api.js"></script>
    <script src="first-login.js"></script>
</body>
</html>
