<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Thời Trang</title>
    
    <!-- Google Fonts: Playfair Display for elegant headings, Montserrat for modern text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons for elegant UI icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#111111',
                            light: '#f9f9f9',
                            accent: '#cfb895' // A soft gold/beige for fashion vibe
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Styles for Inputs */
        .input-fashion {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid #d1d5db;
            border-radius: 0;
            padding: 0.75rem 0;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-fashion:focus {
            outline: none;
            border-bottom: 1px solid #111111;
            box-shadow: 0 1px 0 0 #111111;
        }
        
        /* Smooth image reveal animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(1.05); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 1.5s ease-out forwards;
        }
    </style>
</head>
<body class="bg-brand-light text-brand-dark min-h-screen flex antialiased">

    <div class="flex w-full min-h-screen overflow-hidden">

        <!-- Left Column: Image Background (Hidden on small screens) -->
        <div class="relative hidden lg:flex lg:w-1/2 bg-black items-center justify-center overflow-hidden">
            <!-- Fashion Model Background Image from Unsplash -->
<div class="absolute inset-0 bg-[url('../public/background.jpg')] bg-cover bg-center opacity-90 animate-fade-in"></div>            
            <!-- Dark gradient overlay for text readability -->
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>

            <!-- Inspirational Text Overlay -->
            <div class="relative z-10 text-white p-12 text-center flex flex-col items-center">
                <h2 class="font-serif text-5xl font-bold mb-4 tracking-wide">B'TRIPLE</h2>
                <p class="font-sans text-sm font-light tracking-widest uppercase opacity-80">Định hình phong cách của bạn</p>
            </div>
        </div>

        <!-- Right Column: Login Form -->
        <div class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 md:p-24 bg-white relative">
            
            <!-- Mobile Brand Header (Visible only on mobile) -->
            <div class="absolute top-8 left-0 right-0 text-center lg:hidden">
                <h2 class="font-serif text-3xl font-bold tracking-wide text-brand-dark">L'AURA</h2>
            </div>

            <div class="w-full max-w-md">
                <!-- Form Header -->
                <div class="mb-10 text-left">
                    <h1 class="font-serif text-4xl font-bold mb-3">Chào mừng trở lại!</h1>
                    <p class="text-gray-500 font-sans text-sm">Vui lòng đăng nhập để tiếp tục khám phá bộ sưu tập mới nhất.</p>
                </div>

                <form action="#" method="POST" class="space-y-6">
                    <!-- Email Input -->
                    <div class="relative">
                        <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Email</label>
                        <div class="relative flex items-center">
                            <i class="ph ph-envelope-simple absolute left-0 text-gray-400 text-lg"></i>
                            <input type="email" id="email" name="email" class="input-fashion w-full pl-8 text-sm placeholder-gray-300" placeholder="your@email.com" required>
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="relative">
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Mật khẩu</label>
                        <div class="relative flex items-center">
                            <i class="ph ph-lock-key absolute left-0 text-gray-400 text-lg"></i>
                            <input type="password" id="password" name="password" class="input-fashion w-full pl-8 pr-10 text-sm placeholder-gray-300" placeholder="••••••••" required>
                            
                            <!-- Toggle Password Visibility Button -->
                            <button type="button" id="togglePassword" class="absolute right-0 text-gray-400 hover:text-brand-dark transition-colors focus:outline-none">
                                <i class="ph ph-eye text-lg" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Forgot Password & Remember Me -->
                    <div class="flex items-center justify-between mt-4">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-brand-dark focus:ring-brand-dark border-gray-300 rounded cursor-pointer accent-brand-dark">
                            <label for="remember-me" class="ml-2 block text-xs text-gray-600 cursor-pointer">
                                Ghi nhớ đăng nhập
                            </label>
                        </div>
                        <div class="text-xs">
                            <a href="#" class="font-medium text-brand-dark hover:text-brand-accent transition-colors underline-offset-4 hover:underline">Quên mật khẩu?</a>
                        </div>
                    </div>

                    <!-- Login Button -->
<div class="pt-4">
                        <button type="submit" class="flex justify-center items-center gap-2 w-full bg-black hover:bg-gray-900 text-white py-4 uppercase font-bold tracking-wider transition-all duration-300 group focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-black">
                            ĐĂNG NHẬP
                        </button>
                    </div>
                </form>

                <!-- Divider -->
                <div class="mt-8">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200"></div>
                        </div>
                        <div class="relative flex justify-center text-xs">
                            <span class="px-2 bg-white text-gray-400 uppercase tracking-wider">Hoặc đăng nhập với</span>
                        </div>
                    </div>

                    <!-- Social Login Buttons -->
                    <div class="mt-6 grid grid-cols-2 gap-3">
                        <button class="w-full inline-flex justify-center items-center py-2.5 px-4 border border-gray-300 rounded-none shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                            <i class="ph-fill ph-google-logo text-xl mr-2"></i>
                            Google
                        </button>
                        <button class="w-full inline-flex justify-center items-center py-2.5 px-4 border border-gray-300 rounded-none shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                            <i class="ph-fill ph-facebook-logo text-xl mr-2 text-blue-600"></i>
                            Facebook
                        </button>
                    </div>
                </div>

                <!-- Sign Up Link -->
                <div class="mt-10 text-center">
                    <p class="text-sm text-gray-600">
                        Bạn chưa có tài khoản? 
                        <a href="#" class="font-bold text-brand-dark hover:text-brand-accent transition-colors underline underline-offset-4">Đăng ký ngay</a>
                    </p>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Toggle Password Visibility Logic
        const togglePasswordBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePasswordBtn.addEventListener('click', function (e) {
            // Toggle the type attribute
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Toggle the eye icon (closed/open)
            if (type === 'password') {
                eyeIcon.classList.remove('ph-eye-slash');
                eyeIcon.classList.add('ph-eye');
            } else {
                eyeIcon.classList.remove('ph-eye');
                eyeIcon.classList.add('ph-eye-slash');
            }
        });
    </script>
</body>
</html>
