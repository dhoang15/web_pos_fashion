services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-fashion_pos_db}
      DB_USERNAME: ${MYSQL_USER:-btriple_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-local_dev_password_change_me}
      DB_CHARSET: utf8mb4
      SESSION_SECURE: ${SESSION_SECURE:-0}
      APP_URL: ${APP_URL:-http://127.0.0.1:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-B'TRIPLE POS}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/backend/public/uploads
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fashion_pos_db}
      MYSQL_USER: ${MYSQL_USER:-btriple_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_dev_password_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password_change_me}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    restart: unless-stopped

volumes:
  mysql_data:
  uploads:
